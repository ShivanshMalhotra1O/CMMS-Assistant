retrieval_operations:
  system_prompt: |
    You are a CMMS data retrieval assistant.

    Your job is to understand what the user wants to find and use the available tools to fetch it.

    ─────────────────────────────────────────
    WHAT EACH TOOL ALREADY RETURNS (BUILT-IN JOINS)
    ─────────────────────────────────────────
    get_work_orders  → already includes: assetName, technicians (id + name), lastModifiedBy
    get_assets       → already includes: plant details, createdBy name
    get_users        → returns full user profile including role, department, status

    This means: for most cross-entity questions you only need ONE tool call.
    Only make secondary calls when the user needs DEEPER details not covered above.

    ─────────────────────────────────────────
    TOOL RESPONSE STRUCTURE
    ─────────────────────────────────────────
    Every get_work_orders response returns exactly two fields:
      - data        → array of work order records (capped by limit)
      - totalCount  → TRUE total matching records before the limit was applied

    CRITICAL: data.length is NOT the total. Always read totalCount.
    NEVER present a list without stating totalCount.
    NEVER generate or guess the count — always read it from the tool response.

    ─────────────────────────────────────────
    GENERAL RULES
    ─────────────────────────────────────────

    1. UNDERSTAND the user query
       - Identify the PRIMARY entity: work orders, assets, technicians, users
       - Identify any filters: status, priority, date, name, category, etc.
       - Identify any limits: "last 5", "top 10", "recent", etc.
       - Detect if the query spans multiple entities (join intent)
       - If the user asks for rankings, counts, "top N", "most", "least", "by category" -> use aggregate_data
       - If the user asks for specific records with filters -> use get_work_orders, get_assets, get_users
       - If the user asks ONLY for a count (e.g. "how many work orders does X have") ->
         call get_work_orders with the filter, then read and return ONLY totalCount. Do not list records.

    2. SELECT the right tool
       - For simple retrieval: use get_work_orders, get_assets, get_users
       - For aggregations/analytics: use aggregate_data
       - Examples requiring aggregate_data:
         * "top 5 technicians with most work orders"
         * "assets with highest work order count"
         * "work orders by priority"
         * "count of work orders by status"
         * "technicians ranked by workload"

    3. CROSS-ENTITY QUERIES - CHAINING STRATEGY
       When a query spans multiple entities, use the joins section of this
       registry to plan your tool calls. Follow this decision flow:

       STEP 1 - Check joins.built_in_resolved_fields
                If every field the user needs is already returned by the
                primary tool, make ONE tool call only. No chaining needed.

       STEP 2 - Find the matching recipe in joins.join_catalog
                Match the user's intent to a recipe's intent_triggers list.
                Follow that recipe's steps exactly.

       STEP 3 - Deduplicate before secondary calls
                Extract join_key values from all primary results.
                Deduplicate. Call secondary tool ONCE per unique value.
                Never exceed the recipe's max_secondary cap (default 20).

       STEP 4 - Merge and present as one unified response
                Never show raw tool outputs separately.

       QUICK RECIPE LOOKUP:
         Work orders + asset status/details   -> joins.join_catalog.workorders_with_asset_details
         Assets + their work orders           -> joins.join_catalog.assets_with_work_orders
         Technicians + workload               -> joins.join_catalog.technicians_with_work_orders
         Work orders + technician profile     -> joins.join_catalog.workorders_with_technician_profile
         PM records + asset condition         -> joins.join_catalog.pm_with_asset_details
         Looks like a join but is not         -> joins.join_catalog.no_join_required

    4. EXTRACT filters from natural language
       - Use the field definitions and synonyms below to map user words to correct values
       - Date keywords: today, this week, last month -> convert to date range
       - If a filter is not mentioned: do not pass it, let the tool return all

    5. HANDLE results
       - Always read totalCount from the tool response before composing your reply
       - Always open your reply by stating the count:
         e.g. "Amit Sumit has 183 work orders in total. Here are the most recent 50:"
       - Always present the MERGED/ENRICHED result as a single unified response
       - Never show raw tool outputs separately (e.g. "Here are work orders. Here are assets.")
       - If totalCount is 0: say "No work orders found matching the criteria" and suggest relaxing filters
       - If error: explain what went wrong and ask user to clarify

    6. HANDLE ambiguity
       - If the query is unclear: ask one clarifying question
       - If multiple entities could match: ask user to confirm

    ─────────────────────────────────────────
    RESPONSE FORMAT RULES
    ─────────────────────────────────────────
    For every response involving work orders:

    ✅ ALWAYS start with the count:
       "[Name] has [totalCount] work orders."
       "Found [totalCount] work orders matching your filters."

    ✅ ALWAYS distinguish total vs shown:
       If totalCount > data.length → say "Showing [data.length] of [totalCount]"

    ✅ For count-only queries:
       Just state the number. Do not list records unless asked.

    ❌ NEVER say things like:
       "Here are the work orders:" without mentioning the count
       "I found some work orders" without a specific number
       Any filler message that omits totalCount

    ─────────────────────────────────────────
    EXAMPLE QUERY RESOLUTIONS
    ─────────────────────────────────────────

    "How many work orders does Amit Sumit have?"
    → get_users → resolve "Amit Sumit" to ObjectId
    → get_work_orders(people=<id>)
    → Reply: "Amit Sumit has [totalCount] work orders."

    "Show open work orders with the asset status for each"
    → get_work_orders(status="Open")  [has assetName already]
    → Deduplicate asset names → get_assets(name=X) for each unique asset
    → Merge assetStatus into each work order → present unified table
    → Open reply with: "Found [totalCount] open work orders. Showing [data.length]:"

    "Which assets under maintenance have critical work orders?"
    → get_assets(status="Maintenance")
    → For each asset → get_work_orders(asset_name=X, priority="Critical")
    → Return only assets where work order results are non-empty

    "List busy technicians and their open work order count"
    → get_users(role="technician", status="busy")
    → For each technician → get_work_orders(technician_name=X, status="Open")
    → Read totalCount per technician → present summary table with counts

    "Show high priority work orders and who is assigned"
    → get_work_orders(priority="High")  [already has technicians list]
    → No secondary call needed
    → Reply: "Found [totalCount] high priority work orders. Showing [data.length]:"

  workorder_retrieval:
    description: Retrieve work orders from the workorders collection
    collection: workorders

    fields:
      _id: { type: ObjectId }
      workOrderId: { type: String }
      name: { type: String }
      description: { type: String }

      asset:
        type: ObjectId
        references: assets._id
        description: >
          The asset this work order belongs to.
          Resolve asset name to ObjectId before filtering.

      priority:
        type: enum
        canonical_values:
          - Low
          - Medium
          - High
          - Critical
        accepted_synonyms:
          low: Low
          routine: Low
          normal: Medium
          medium: Medium
          high: High
          urgent: High
          critical: Critical
          emergency: Critical

      workStatus:
        type: enum
        canonical_values:
          - Open
          - In Progress
          - Closed
          - Cancelled
        accepted_synonyms:
          open: Open
          pending: Open
          new: Open
          running: In Progress
          in progress: In Progress
          active: In Progress
          ongoing: In Progress
          closed: Closed
          done: Closed
          completed: Closed
          resolved: Closed
          cancelled: Cancelled
          canceled: Cancelled

      category:
        type: enum
        canonical_values:
          - Corrective
          - Preventive
          - Inspection
          - Damage
          - Emergency
        accepted_synonyms:
          breakdown: Corrective
          failed: Corrective
          not working: Corrective
          stopped: Corrective
          scheduled: Preventive
          preventive: Preventive
          routine: Preventive
          inspect: Inspection
          check: Inspection
          verify: Inspection
          leaking: Damage
          wear: Damage
          cracks: Damage
          corrosion: Damage
          damage: Damage
          emergency: Emergency

      companyId: { type: ObjectId, references: companies._id }
      plantId: { type: ObjectId, references: plants._id }
      pmId: { type: ObjectId, references: preventiveMaintenance._id }
      lastModifiedBy: { type: ObjectId, references: users._id }

      people:
        type: array
        items: ObjectId
        references: users._id
        semantics: assignees
        description: >
          List of users assigned to the work order.
          Used for queries like "assigned to", "technician",
          "responsible person". Resolve name to ObjectId before filtering.

      dueDate:
        type: Date
        description: >
          Due date of the work order.
          Used for queries like "overdue", "due this week",
          "due before X". Compare against current date for overdue queries.

      createdAt:
        type: Date
        description: >
          When the work order was created.
          Used for queries like "created last month", "recent", "this week".

      updatedAt: { type: Date }

      deleted:
        type: Boolean
        description: Always filter with deleted=false. Never return deleted records.

    filter_examples:
      - user_says: "show all open work orders"
        filters: { workStatus: "Open", deleted: false }

      - user_says: "work orders for BFW BMV 1600"
        filters: { asset_name: "BFW BMV 1600", deleted: false }

      - user_says: "high priority damage work orders"
        filters: { priority: "High", category: "Damage", deleted: false }

      - user_says: "overdue work orders"
        filters: { dueDate: { lt: today }, workStatus: "Open", deleted: false }

      - user_says: "last 5 closed work orders"
        filters: { workStatus: "Closed", deleted: false }
        limit: 5

      - user_says: "work orders assigned to John"
        filters: { people: "<resolve John's _id>", deleted: false }

      - user_says: "work orders created this week"
        filters: { createdAt: { gte: start_of_week }, deleted: false }

    pipeline:
      description: >
        Base MongoDB aggregation pipeline for work order retrieval.
        The tool dynamically injects $match filters based on user query
        before executing. Template variables are replaced at runtime.
      stages: |
        [
          {
            "$match": {
              "deleted": false
            }
          },
          {
            "$lookup": {
              "from": "assets",
              "localField": "asset",
              "foreignField": "_id",
              "as": "assetDetails"
            }
          },
          {
            "$lookup": {
              "from": "users",
              "localField": "people",
              "foreignField": "_id",
              "as": "technicianDetails"
            }
          },
          {
            "$lookup": {
              "from": "users",
              "localField": "lastModifiedBy",
              "foreignField": "_id",
              "as": "lastModifiedByDetails"
            }
          },
          {
            "$project": {
              "_id": 1,
              "workOrderId": 1,
              "name": 1,
              "description": 1,
              "workStatus": 1,
              "priority": 1,
              "category": 1,
              "dueDate": 1,
              "createdAt": 1,
              "updatedAt": 1,
              "assetName": { "$arrayElemAt": ["$assetDetails.name", 0] },
              "technicians": {
                "$map": {
                  "input": "$technicianDetails",
                  "as": "t",
                  "in": {
                    "id": "$$t._id",
                    "name": { "$concat": ["$$t.firstName", " ", "$$t.lastName"] }
                  }
                }
              },
              "lastModifiedBy": {
                "$arrayElemAt": [
                  {
                    "$map": {
                      "input": "$lastModifiedByDetails",
                      "as": "u",
                      "in": { "$concat": ["$$u.firstName", " ", "$$u.lastName"] }
                    }
                  },
                  0
                ]
              }
            }
          },
          {
            "$facet": {
              "data": [
                { "$sort": { "createdAt": -1 } },
                { "$limit": "{{limit}}" }
              ],
              "totalCount": [
                { "$count": "count" }
              ]
            }
          },
          {
            "$project": {
              "data": 1,
              "totalCount": { 
                "$ifNull": [{"$arrayElemAt": ["$totalCount.count", 0]}, 0]}
            }
          }
        ]

      dynamic_filters:
        description: >
          These filters are injected into the $match stage at runtime
          based on user query. All are optional.
        filters:
          - field: asset
            type: ObjectId
            inject_when: asset_name is provided
            note: Resolve asset name to ObjectId via assets collection first

          - field: workStatus
            type: String
            inject_when: status keyword detected in user query

          - field: priority
            type: String
            inject_when: priority keyword detected in user query

          - field: category
            type: String
            inject_when: category keyword detected in user query

          - field: people
            type: ObjectId
            inject_when: technician name or id mentioned
            note: Resolve technician name to ObjectId via users collection first

          - field: dueDate
            type: Date
            inject_when: date/overdue keyword detected
            operators: [$lt, $gt, $gte, $lte]

          - field: createdAt
            type: Date
            inject_when: creation date keyword detected
            operators: [$gte, $lte]

  asset_retrieval:

    description: Retrieve assets from the assets collection
    collection: assets

    fields:
      _id: { type: ObjectId }

      name:
        type: String
        description: Asset name. Used for queries like "show me Hydraulic Pump".

      description: { type: String }

      typeOfAsset:
        type: String
        description: >
          Type or category of the asset (e.g. cnc, pump, motor, conveyor).
          Used for queries like "show all CNC machines", "list all pumps".

      assetStatus:
        type: enum
        canonical_values:
          - Running
          - Idle
          - Maintenance
          - Stopped
        accepted_synonyms:
          running: Running
          active: Running
          working: Running
          operational: Running
          idle: Idle
          standby: Idle
          under maintenance: Maintenance
          in maintenance: Maintenance
          maintenance: Maintenance
          breakdown: Maintenance
          broken: Maintenance
          failed: Stopped
          not working: Stopped
          stopped: Stopped
          decommissioned: Stopped
          retired: Stopped
          scrapped: Stopped

      modelOfAsset:
        type: String
        description: Model number of the asset (e.g. HP-500).

      manufacturer:
        type: String
        description: Manufacturer name (e.g. Industrial Equip Co.).

      serialNumber:
        type: String
        description: Serial number of the asset (e.g. SN-123456).

      location:
        type: String
        description: >
          Physical location of the asset (e.g. Building A, Floor 2).
          Used for queries like "assets in Building A".

      qrcode: { type: String }

      companyId: { type: ObjectId, references: companies._id }

      plant:
        type: ObjectId
        references: plants._id
        description: Plant where the asset is located.

      installationDate:
        type: Date
        description: >
          When the asset was installed.
          Used for queries like "installed last year", "installed before 2024".

      warrantyExpiryDate:
        type: Date
        description: >
          When the warranty expires.
          Used for queries like "warranty expiring soon", "warranty expired".

      createdBy: { type: ObjectId, references: users._id }
      createdAt: { type: Date }
      updatedAt: { type: Date }

      deleted:
        type: Boolean
        description: Always filter with deleted=false. Never return deleted records.

      isDummyData:
        type: Boolean
        description: Filter with isDummyData=false to exclude test/dummy records.

    filter_examples:
      - user_says: "show all assets"
        filters: { deleted: false, isDummyData: false }

      - user_says: "show running assets"
        filters: { assetStatus: "Running", deleted: false, isDummyData: false }

      - user_says: "show all CNC machines"
        filters: { typeOfAsset: "cnc", deleted: false, isDummyData: false }

      - user_says: "assets in Building A"
        filters: { location: { regex: "Building A" }, deleted: false, isDummyData: false }

      - user_says: "assets under maintenance"
        filters: { assetStatus: "Under Maintenance", deleted: false, isDummyData: false }

      - user_says: "show Hydraulic Pump"
        filters: { name: "Hydraulic Pump", deleted: false, isDummyData: false }

      - user_says: "assets with warranty expiring this month"
        filters: { warrantyExpiryDate: { gte: start_of_month, lte: end_of_month }, deleted: false }

      - user_says: "broken assets"
        filters: { assetStatus: "Breakdown", deleted: false, isDummyData: false }

    pipeline:

      description: >
        Base MongoDB aggregation pipeline for asset retrieval.
        The tool dynamically injects $match filters before executing.
      stages: |
        [
          {
            "$match": {
              "deleted": false,
              "isDummyData": false
            }
          },
          {
            "$lookup": {
              "from": "plants",
              "localField": "plant",
              "foreignField": "_id",
              "as": "plantDetails"
            }
          },
          {
            "$lookup": {
              "from": "users",
              "localField": "createdBy",
              "foreignField": "_id",
              "as": "createdByDetails"
            }
          },
          {
            "$project": {
              "_id": 1,
              "name": 1,
              "description": 1,
              "typeOfAsset": 1,
              "assetStatus": 1,
              "modelOfAsset": 1,
              "manufacturer": 1,
              "serialNumber": 1,
              "location": 1,
              "qrcode": 1,
              "installationDate": 1,
              "warrantyExpiryDate": 1,
              "createdAt": 1,
              "updatedAt": 1,
              "plantName": { "$arrayElemAt": ["$plantDetails.name", 0] },
              "createdBy": {
                "$arrayElemAt": [
                  {
                    "$map": {
                      "input": "$createdByDetails",
                      "as": "u",
                      "in": { "$concat": ["$$u.firstName", " ", "$$u.lastName"] }
                    }
                  },
                  0
                ]
              }
            }
          },
          {
            "$sort": { "createdAt": -1 }
          },
          {
            "$limit": "{{limit}}"
          }
        ]

      dynamic_filters:
        description: >
          These filters are injected into the $match stage at runtime.
          All are optional.
        filters:
          - field: name
            type: String
            inject_when: asset name mentioned in query

          - field: assetStatus
            type: String
            inject_when: status keyword detected in query

          - field: typeOfAsset
            type: String
            inject_when: asset type mentioned in query

          - field: location
            type: String
            inject_when: location mentioned in query
            note: Use regex for partial match

          - field: manufacturer
            type: String
            inject_when: manufacturer name mentioned in query

          - field: installationDate
            type: Date
            inject_when: installation date keyword detected
            operators: [$gte, $lte]

          - field: warrantyExpiryDate
            type: Date
            inject_when: warranty keyword detected
            operators: [$gte, $lte]

  users_retrieval:
    description: Retrieve users (technicians, admins, managers) from the users collection
    collection: users
 
    fields:
      _id: { type: ObjectId }
 
      firstName:
        type: String
        description: First name of the user (e.g. "John").
 
      lastName:
        type: String
        description: Last name of the user (e.g. "Singh").
 
      email: { type: String }
 
      department:
        type: String
        description: >
          Department the user belongs to (e.g. "Maintenance", "Production").
          Used for queries like "technicians in Maintenance".
 
      phoneNumber: { type: String }
 
      companyId: { type: ObjectId, references: companies._id }
 
      plantId:
        type: ObjectId
        references: plants._id
        description: Plant where the user is assigned.
 
      role:
        type: enum
        canonical_values:
          - technician
          - admin
          - manager
          - viewer
        accepted_synonyms:
          tech: technician
          engineer: technician
          operator: technician
          administrator: admin
          superuser: admin
          supervisor: manager
          lead: manager
          read only: viewer
        description: >
          Role of the user in the system.
          Used for queries like "show all admins", "list technicians".
 
      userTitle:
        type: String
        description: Job title of the user (e.g. "Technician", "Shift Supervisor").
 
      isVerified:
        type: Boolean
        description: >
          Whether the user's account has been verified.
          Used for queries like "show unverified users".
 
      shiftId:
        type: ObjectId
        references: shifts._id
        description: Shift assigned to the user.
 
      notificationPreference:
        type: String
        description: >
          User's preferred notification channel (e.g. "Browser", "Email", "SMS").
          Can also be an object with per-channel settings.
 
      status:
        type: enum
        canonical_values:
          - available
          - busy
        accepted_synonyms:
          present: available
          active: available
          free: available
          idle: available
          standby: available
          working: busy
          on leave: busy
          away: busy
          occupied: busy
        description: >
          Current availability status of the user.
          Used for queries like "show available technicians".
 
      maxSessions:
        type: Number
        description: Maximum number of concurrent sessions allowed for the user.
 
      deleted:
        type: Boolean
        description: Always filter with deleted=false. Never return deleted records.
 
      createdBy: { type: ObjectId, references: users._id }
 
      createdAt: { type: Date }
 
      updatedAt: { type: Date }
 
      createdDate: { type: Date }
 
      lastLogin:
        type: Date
        description: >
          Timestamp of the user's most recent login.
          Used for queries like "users who logged in this week", "inactive users".
 
      lastUpdated:
        type: Date
        description: Timestamp of the last profile update (alias of updatedAt in some records).
 
      kpiLastUpdated:
        type: Date
        description: Timestamp of the last KPI recalculation for this user.
 
    filter_examples:
      - user_says: "show all technicians"
        filters: { role: "technician", deleted: false }
 
      - user_says: "list all admins"
        filters: { role: "admin", deleted: false }
 
      - user_says: "show available technicians"
        filters: { role: "technician", status: "available", deleted: false }
 
      - user_says: "users in Maintenance department"
        filters: { department: "Maintenance", deleted: false }
 
      - user_says: "show unverified users"
        filters: { isVerified: false, deleted: false }
 
      - user_says: "find John Singh"
        filters: { firstName: "John", lastName: "Singh", deleted: false }
 
      - user_says: "users who logged in this week"
        filters: { lastLogin: { gte: start_of_week }, deleted: false }
 
      - user_says: "technicians in Production"
        filters: { role: "technician", department: "Production", deleted: false }
 
    pipeline:
      description: >
        Base MongoDB aggregation pipeline for user retrieval.
        The tool dynamically injects $match filters based on user query
        before executing. Template variables are replaced at runtime.
      stages: |
        [
          {
            "$match": {
              "deleted": false
            }
          },
          {
            "$lookup": {
              "from": "plants",
              "localField": "plantId",
              "foreignField": "_id",
              "as": "plantDetails"
            }
          },
          {
            "$lookup": {
              "from": "users",
              "localField": "createdBy",
              "foreignField": "_id",
              "as": "createdByDetails"
            }
          },
          {
            "$project": {
              "_id": 1,
              "firstName": 1,
              "lastName": 1,
              "email": 1,
              "department": 1,
              "phoneNumber": 1,
              "role": 1,
              "userTitle": 1,
              "isVerified": 1,
              "status": 1,
              "notificationPreference": 1,
              "lastLogin": 1,
              "createdAt": 1,
              "updatedAt": 1,
              "plantName": { "$arrayElemAt": ["$plantDetails.name", 0] },
              "createdBy": {
                "$arrayElemAt": [
                  {
                    "$map": {
                      "input": "$createdByDetails",
                      "as": "u",
                      "in": { "$concat": ["$$u.firstName", " ", "$$u.lastName"] }
                    }
                  },
                  0
                ]
              }
            }
          },
          {
            "$sort": { "createdAt": -1 }
          },
          {
            "$limit": "{{limit}}"
          }
        ]
 
      dynamic_filters:
        description: >
          These filters are injected into the $match stage at runtime
          based on user query. All are optional.
        filters:
          - field: firstName
            type: String
            inject_when: first name mentioned in query
            note: Use regex for partial/case-insensitive match
 
          - field: lastName
            type: String
            inject_when: last name mentioned in query
            note: Use regex for partial/case-insensitive match

          - field: email
            type: String
            inject_when: email address mentioned in query
            note: Use exact match or regex for partial/case-insensitive match
 
          - field: role
            type: String
            inject_when: role keyword detected in query
 
          - field: department
            type: String
            inject_when: department name mentioned in query
            note: Use regex for partial match
 
          - field: status
            type: String
            inject_when: availability/status keyword detected in query
 
          - field: isVerified
            type: Boolean
            inject_when: verified/unverified keyword detected
 
          - field: lastLogin
            type: Date
            inject_when: login date or activity keyword detected
            operators: [$gte, $lte]
 
          - field: createdAt
            type: Date
            inject_when: creation date keyword detected
            operators: [$gte, $lte]
 
  preventive_maintenance_retrieval:
    description: Retrieve preventive maintenance records from the preventiveMaintenance collection
    collection: preventivemaintenances

    fields:
      _id: { type: ObjectId }

      preventiveMaintenanceId:
        type: String
        description: Unique PM identifier (e.g. PM-3). Used for queries like "show PM-3".

      name:
        type: String
        description: Name of the PM record (e.g. PM 2).

      description: { type: String }

      assetAllocation:
        type: ObjectId
        references: assets._id
        description: >
          The asset this PM is allocated to.
          Resolve asset name to ObjectId before filtering.

      plantId:
        type: ObjectId
        references: plants._id

      shiftId:
        type: ObjectId
        references: shifts._id

      companyId:
        type: ObjectId
        references: companies._id

      createdBy:
        type: ObjectId
        references: users._id

      lastModifiedBy:
        type: ObjectId
        references: users._id

      selectWorkOrder:
        type: Object
        description: Work order configuration linked to this PM.

      schedule:
        type: Object
        description: >
          Scheduling configuration for the PM.
          Used for queries like "weekly PM", "monthly maintenance schedule".

      trigger:
        type: Object
        description: >
          Trigger configuration for when PM is activated.

      nextGenerationDate:
        type: Date
        description: >
          When the next PM work order will be generated.
          Used for queries like "PM due soon", "next maintenance date",
          "PM scheduled this week".

      lastMaintenanceDate:
        type: Date
        description: >
          When the last maintenance was performed.
          Used for queries like "recently maintained", "last serviced".

      deleted:
        type: Boolean
        description: Always filter with deleted=false. Never return deleted records.

      createdAt: { type: Date }
      updatedAt: { type: Date }

    filter_examples:
      - user_says: "show all preventive maintenance"
        filters: { deleted: false }

      - user_says: "show PM for BFW BMV 1600"
        filters: { assetAllocation: "<resolve asset ObjectId>", deleted: false }

      - user_says: "PM due this week"
        filters: { nextGenerationDate: { gte: start_of_week, lte: end_of_week }, deleted: false }

      - user_says: "recently maintained assets"
        filters: { lastMaintenanceDate: { gte: last_30_days }, deleted: false }

      - user_says: "show PM-3"
        filters: { preventiveMaintenanceId: "PM-3", deleted: false }

    pipeline:
      description: >
        Base MongoDB aggregation pipeline for preventive maintenance retrieval.
        The tool dynamically injects $match filters before executing.
      stages: |
        [
          {
            "$match": {
              "deleted": false
            }
          },
          {
            "$lookup": {
              "from": "assets",
              "localField": "assetAllocation",
              "foreignField": "_id",
              "as": "assetDetails"
            }
          },
          {
            "$lookup": {
              "from": "plants",
              "localField": "plantId",
              "foreignField": "_id",
              "as": "plantDetails"
            }
          },
          {
            "$lookup": {
              "from": "users",
              "localField": "createdBy",
              "foreignField": "_id",
              "as": "createdByDetails"
            }
          },
          {
            "$project": {
              "_id": 1,
              "preventiveMaintenanceId": 1,
              "name": 1,
              "description": 1,
              "schedule": 1,
              "trigger": 1,
              "nextGenerationDate": 1,
              "lastMaintenanceDate": 1,
              "createdAt": 1,
              "updatedAt": 1,
              "assetName": { "$arrayElemAt": ["$assetDetails.name", 0] },
              "plantName": { "$arrayElemAt": ["$plantDetails.name", 0] },
              "createdBy": {
                "$arrayElemAt": [
                  {
                    "$map": {
                      "input": "$createdByDetails",
                      "as": "u",
                      "in": { "$concat": ["$$u.firstName", " ", "$$u.lastName"] }
                    }
                  },
                  0
                ]
              }
            }
          },
          {
            "$sort": { "createdAt": -1 }
          },
          {
            "$limit": "{{limit}}"
          },
          {
            "$facet": {
              "data": [
                { "$sort": { "createdAt": -1 } },
                { "$limit": "{{limit}}" }
              ],
              "totalCount": [
                { "$count": "count" }
              ]
            }
          },
          {
            "$project": {
              "data": 1,
              "totalCount": {
                "$ifNull": [{ "$arrayElemAt": ["$totalCount.count", 0] }, 0]
              }
            }
          }
        ]

      dynamic_filters:
        description: >
          These filters are injected into the $match stage at runtime.
          All are optional.
        filters:
          - field: preventiveMaintenanceId
            type: String
            inject_when: PM ID mentioned in query (e.g. PM-3)

          - field: assetAllocation
            type: ObjectId
            inject_when: asset name mentioned in query
            note: Resolve asset name to ObjectId via assets collection first

          - field: nextGenerationDate
            type: Date
            inject_when: due date or scheduled date keyword detected
            operators: [$gte, $lte]

          - field: lastMaintenanceDate
            type: Date
            inject_when: last maintenance or recently serviced keyword detected
            operators: [$gte, $lte]

          - field: plantId
            type: ObjectId
            inject_when: plant name mentioned in query
            note: Resolve plant name to ObjectId via plants collection first

  # =============================================================================
  # JOINS - Cross-collection relationships and join strategies
  # =============================================================================

  joins:

    # What each tool already returns (no secondary call needed)
    built_in_fields:
      get_work_orders:
        - assetName
        - technicians (id and name)
        - lastModifiedBy
      get_assets:
        - plantName
        - createdBy
      get_users:
        - plantName
        - createdBy
      get_preventive_maintenance:
        - assetName
        - plantName
        - createdBy

    # Join recipes - when secondary calls are needed
    recipes:

      workorders_with_asset_details:
        when: "user needs asset status/location/warranty beyond just asset name"
        primary: get_work_orders
        secondary: get_assets (join on assetName, max 20)
        adds:
          - assetStatus
          - location
          - typeOfAsset
          - manufacturer
          - warrantyExpiryDate

      assets_with_work_orders:
        when: "user wants assets and their work orders"
        primary: get_assets
        secondary: get_work_orders (join on name, max 20)
        adds:
          - workOrderId
          - workStatus
          - priority
          - dueDate
          - technicians

      technicians_with_work_orders:
        when: "user wants technician workload"
        primary: get_users (role=technician)
        secondary: get_work_orders (join on technician_name, max 20)
        adds:
          - workOrderId
          - workStatus
          - priority
          - assetName
          - dueDate

      workorders_with_technician_profile:
        when: "user needs technician email/dept/status beyond just name"
        primary: get_work_orders
        secondary: get_users (join on technicians name, max 20)
        adds:
          - email
          - department
          - phoneNumber
          - status
          - role

      pm_with_asset_details:
        when: "user needs asset condition alongside PM schedule"
        primary: get_preventive_maintenance
        secondary: get_assets (join on assetName, max 20)
        adds:
          - assetStatus
          - location
          - typeOfAsset
          - warrantyExpiryDate

    # Decision flow
    rules:
      - If query needs only one collection → use single tool
      - If needed fields are in built_in_fields → use single tool
      - Otherwise → pick matching recipe, deduplicate join keys, call secondary once per unique value
        - Always merge results before responding